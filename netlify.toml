[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# Nette boekingslink voor outreach: selectly.be/demo → GHL-agenda
[[redirects]]
  from = "/demo"
  to = "https://api.leadconnectorhq.com/widget/bookings/selectly-demo"
  status = 302
  force = true

# Er stonden twee rekentools op de site die elkaar tegenspraken. Met dezelfde
# invoer (80 aanvragen, 28% conversie, €8.500 orderwaarde) toonde de omzetscan
# €571.200 verlies per jaar en de ROI-calculator €12.711 winst per maand
# (€152.532 per jaar) — factor 3,7 verschil, allebei bereikbaar vanuit dezelfde
# navigatie. De omzetscan rekende het volledige omzetverlies zonder marge en
# noemde dat "verlies"; een gemiste order kost je je marge, niet de hele order.
# roi.html is voortaan de enige rekentool. De bestanden blijven staan, de URL's
# gaan permanent naar de tool die wel klopt.
[[redirects]]
  from = "/omzetscan"
  to = "/roi.html"
  status = 301
  force = true

[[redirects]]
  from = "/omzetscan.html"
  to = "/roi.html"
  status = 301
  force = true

# Status- en roadmappagina uit de lucht. status.html toonde 99,95% en 99,92%
# uptime terwijl diezelfde pagina zei dat er nog geen automatische bewaking is —
# die cijfers zijn nooit gemeten. roadmap.html beloofde een voicebot in Q3 2026
# die er niet is, en een release-cadans zonder klanten om voor te releasen.
[[redirects]]
  from = "/status"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/status.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/roadmap"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/roadmap.html"
  to = "/"
  status = 301
  force = true

# De broncode van de functies stond publiek leesbaar op selectly.be, waardoor
# de volledige system prompt van de intake-assistent op straat lag.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Blog-bronbestanden staan in _bron/ (buiten de publicatiemap) omdat Netlify
# geen redirects op bestandsextensie ondersteunt. Ze werden anders als duplicaat
# van de .html-versie mee gedeployed en konden geindexeerd worden.

# OfferteScout stond onder /vraag/ op dit domein. Twee redenen om het weg te halen:
# Selectly belooft klanten dat het geen leads binnenbrengt, terwijl OfferteScout leads
# verzamelt en aan installateurs levert — op hetzelfde domein zag een prospect iemand
# die aan beide kanten van de tafel zit. En belangrijker: die pagina's beweerden dat de
# Vlaamse thuisbatterijpremie "afloopt op 31/12/2026" met "nog tot €1.725 terug", terwijl
# die premie op 31 maart 2024 definitief gesloten is. Kunstmatige urgentie op een
# onbestaand voordeel is een misleidende handelspraktijk.
# De herbouwde, geverifieerde versie staat klaar in ~/offertescout voor een eigen domein.
[[redirects]]
  from = "/vraag/*"
  to = "/"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Portaalbeveiliging
# ---------------------------------------------------------------------------
# Het volledige klantenportaal was publiek leesbaar: admin.html toonde de
# klantenlijst met omzet per klant aan iedereen die de URL kende. De auth-guard
# draait in de browser en beschermt dus niets — de HTML is al geleverd voor hij
# iets doet. Deze regels controleren het Identity-token aan de rand, vóór er
# iets verstuurd wordt.
#
# EENMALIG IN NETLIFY, VOOR DIT WERKT:
#   1. Project → Identity → Enable (staat al aan, invite-only)
#   2. Nodig jezelf uit als gebruiker
#   3. Bij die gebruiker: Roles → voeg "admin" toe
#   4. Voor elke klant: rol "klant-<slug>", bv. "klant-mertens-dakwerken".
#      De juiste rolnaam staat bij zijn regel in het gegenereerde blok hieronder.
#
# Werkt aanmelden niet en sta je buiten? Zet deze twee blokken tijdelijk in
# commentaar, deploy opnieuw, en je bent weer binnen.
#
# demo.html en installateur.html blijven bewust open: dat is de verkoopdemo.

# Het oude demo-adres moet vóór de portal-beveiliging staan, anders vangt
# /portal/* het weg en komt wie de oude link nog heeft op de inlogpagina uit.
[[redirects]]
  from = "/portal/nxtg.html"
  to = "/portal/demo.html"
  status = 301
  force = true

# Deze drie blijven open: de inlogpagina zelf en de verkoopdemo.
[[redirects]]
  from = "/portal/login.html"
  to = "/portal/login.html"
  status = 200
  force = true

[[redirects]]
  from = "/portal/demo.html"
  to = "/portal/demo.html"
  status = 200
  force = true

[[redirects]]
  from = "/portal/installateur.html"
  to = "/portal/installateur.html"
  status = 200
  force = true

# admin.html toont de klantenlijst met omzet per klant. Alleen admin.
[[redirects]]
  from = "/portal/admin.html"
  to = "/portal/admin.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

# ─── PORTAAL-REGELS PER KLANT ─── AUTOMATISCH GEGENEREERD ───────────────────
# Wordt herschreven door `npm run portalen`. Niet met de hand bewerken: uw
# wijziging verdwijnt bij de volgende run. Pas portal/_klanten/<slug>.json aan.
#
# Waarom per klant en niet één regel voor iedereen: met de rol "klant" op heel
# /portal/* kon elke ingelogde klant het portaal van elke andere klant openen.
# Met één klant was dat onzichtbaar, vanaf klant 2 is het een datalek. Elke klant
# krijgt nu zijn eigen rol; in Netlify Identity zet u die op zijn gebruiker.
# >>> BEGIN GEGENEREERDE PORTAAL-REGELS
# favorcool — rol "klant-favorcool" op zijn gebruiker in Netlify Identity
[[redirects]]
  from = "/portal/favorcool.html"
  to = "/portal/favorcool.html"
  status = 200
  force = true
  conditions = {Role = ["admin", "klant-favorcool"]}

# mertens-dakwerken — rol "klant-mertens-dakwerken" op zijn gebruiker in Netlify Identity
[[redirects]]
  from = "/portal/mertens-dakwerken.html"
  to = "/portal/mertens-dakwerken.html"
  status = 200
  force = true
  conditions = {Role = ["admin", "klant-mertens-dakwerken"]}
# <<< EINDE GEGENEREERDE PORTAAL-REGELS

# Uw eigen werkschermen. Deze tonen leads, offertes en campagnes over klanten
# heen, dus alleen admin. Klantportalen linken hier niet naar; die zijn
# zelfstandig. mertens.html is het oude portaal, blijft admin-only.
[[redirects]]
  from = "/portal/index.html"
  to = "/portal/index.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/portal/leads.html"
  to = "/portal/leads.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/portal/offertes.html"
  to = "/portal/offertes.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/portal/campagnes.html"
  to = "/portal/campagnes.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/portal/instellingen.html"
  to = "/portal/instellingen.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/portal/mertens.html"
  to = "/portal/mertens.html"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

# Onderdelen die elke ingelogde klant mag zien (de inlogpagina en de verkoopdemo
# staan hierboven al open). Alles wat hier niet expliciet staat, valt door naar
# de 302 hieronder.

# Geen geldige rol? Naar de inlogpagina in plaats van de inhoud.
[[redirects]]
  from = "/portal/*"
  to = "/portal/login.html"
  status = 302
  force = true

# Het onboardingformulier is intern: het toont het volledige opstartproces en de
# pakketprijzen. Stond publiek op 200, nu achter dezelfde rollen als het portaal.
[[redirects]]
  from = "/onboarding/*"
  to = "/onboarding/:splat"
  status = 200
  force = true
  conditions = {Role = ["admin"]}

[[redirects]]
  from = "/onboarding/*"
  to = "/portal/login.html"
  status = 302
  force = true

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    # Content-Security-Policy — hosts geinventariseerd op 30-08-2026 uit alle .html.
    # 'unsafe-inline' is nodig zolang de Tailwind play-CDN de stijlen at runtime injecteert
    # en er 7 inline <script>-blokken op index.html staan.
    # 'unsafe-eval' is NIET optioneel: Alpine.js evalueert zijn x-data/x-for-expressies
    # met new Function(). Zonder deze vlag valt Alpine stil en blijven 21 pagina's leeg —
    # o.a. demo-ai, index, pakketten, roi, omzetscan, calculator en de blog.
    # (Fout gemaakt en vastgesteld op 31-08-2026. Niet weghalen zonder Alpine te vervangen
    #  door de CSP-veilige build, die geen expressies in attributen toelaat.)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://identity.netlify.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.facebook.com https://cdn.jsdelivr.net; connect-src 'self' https://identity.netlify.com https://api.leadconnectorhq.com https://www.facebook.com; frame-src https://api.leadconnectorhq.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests"

# Klantportalen mogen nooit geindexeerd worden. De noindex-meta blijft staan;
# deze header vangt ook bestanden af die die meta niet hebben.
[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/onboarding/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------
# Bewust NIET op /*.js — consent.js, intake-widget.js, lead-meta.js en
# auth-guard.js hebben geen versiehash in hun naam. Lang cachen betekent dat
# een fix bij bestaande bezoekers niet aankomt.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Bouwgereedschap en projectbestanden stonden op 200: /package.json en
# /tools/bouw-portalen.mjs waren gewoon op te vragen. Dat is geen geheim, maar het
# vertelt een aanvaller wel precies hoe de portalen gegenereerd worden en welke
# klantslugs bestaan. Hoort niet op het publieke domein. (webdev, 01-09-2026)
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

# _bron/ bevat de markdown-bronnen van de blog. Die stonden mee online en waren
# gewoon op te vragen — inclusief passages die in de gepubliceerde artikels al
# geanonimiseerd waren. Bronmateriaal hoort niet op het publieke domein.
[[redirects]]
  from = "/_bron/*"
  to = "/404.html"
  status = 404
  force = true

# De case en de verkoopdemo heetten vroeger naar het installatiebedrijf uit de
# praktijktest. Dat bedrijf blijft gescheiden van Selectly, dus staat de naam
# niet langer in de URL. Oude adressen blijven werken.
[[redirects]]
  from = "/case-nxtg.html"
  to = "/case-installateur.html"
  status = 301
  force = true
# (het oude /portal/nxtg.html-adres staat hoger, vóór de portal-beveiliging)
