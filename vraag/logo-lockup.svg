<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 74" width="340" height="74" role="img" aria-label="Stielkenner — wij kennen de stiel">
  <title>Stielkenner — wij kennen de stiel</title>
  <!-- Volledige logo-eenheid: merkteken + woordmerk + slogan.
       Het woordmerk staat hier als tekst, niet als contouren. Wie dit bestand opent
       zonder de opgegeven letterfamilies ziet een systeemletter. Vóór drukwerk of
       levering aan een externe partij eerst de tekst naar paden omzetten. -->
  <path d="M52 22 a12.5 12.5 0 1 0 -13.3 14.8 a12.5 12.5 0 1 1 -13.3 14.8"
        stroke="#2b3540" stroke-width="9.8" fill="none" stroke-linecap="round"/>
  <path d="M38.7 36.8 a12.5 12.5 0 0 1 -13.3 14.8"
        stroke="#22b3d6" stroke-width="9.8" fill="none" stroke-linecap="round"/>

  <text x="76" y="36" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="27" font-weight="800" letter-spacing="-0.5" fill="#2b3540">STIELKENNER</text>
  <line x1="77" y1="45" x2="325" y2="45" stroke="#2b3540" stroke-width="1.2" opacity="0.35"/>
  <text x="77" y="62" font-family="-apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="13" fill="#46535e">Wij kennen de stiel</text>
</svg>
