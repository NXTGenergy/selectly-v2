<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Stielkenner">
  <title>Stielkenner</title>
  <!-- Merkteken: een dichtgeklapte duimstok die tegelijk een vinkje vormt.
       De duimstok is het herkenbaarste voorwerp van de Vlaamse vakman; het
       vinkje zegt "goedgekeurd". Het puntje op de knik is de klinknagel van
       het scharnier — dat detail maakt er een duimstok van en geen gewoon vinkje. -->
  <rect width="40" height="40" rx="9" fill="#1d2b2a"/>
  <path d="M11 21 L17.5 27.5" stroke="#e0a33e" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M17.5 27.5 L30 12" stroke="#f2efe6" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="17.5" cy="27.5" r="1.7" fill="#1d2b2a"/>
</svg>
